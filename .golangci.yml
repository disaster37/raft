version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosec
    - gocritic
    - misspell
    - bodyclose
    - unconvert
    - unparam
    - whitespace
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - gocritic
          - bodyclose
          - unparam
      - path: ^examples/
        linters:
          - errcheck
          - gosec
          - gocritic
          - bodyclose

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/disaster37/go-raft
